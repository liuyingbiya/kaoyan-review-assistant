# ============================================================
#  AI 知识库问答 · 后端配置
#  端口 8081（避开点餐系统的 8080）
# ============================================================
server.port=8081

# ---------- 数据库 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/ai_kb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- MyBatis ----------
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.aikb.model

# ---------- 大模型（DeepSeek，OpenAI 兼容接口）----------
# key 不要写死在代码里。两种注入方式，任选其一：
#   1) 环境变量：  $env:DEEPSEEK_API_KEY="sk-xxx"  然后启动
#   2) 直接填下面这一行（本地演示可以，提交到 Git 前必须清空）
llm.api-key=${DEEPSEEK_API_KEY:}
llm.base-url=https://api.deepseek.com
llm.model=deepseek-chat
# 流式模拟模式：没有 key 时置 true，接口仍然可用（返回固定文本），
# 这样整条链路（检索 → 拼 Prompt → 流式下发）都能测，不依赖外网。
llm.mock=${LLM_MOCK:false}

# ---------- 检索 ----------
rag.top-k=5
rag.chunk-size=400
rag.chunk-overlap=80

# ---------- 启动时自动导入初始语料 ----------
# 目录下每个子文件夹名就是知识库分类：seed/kaoyan、seed/project
# 幂等：按标题查重，已导入过的会跳过
rag.seed-auto=true
rag.seed-dir=../seed

# ---------- 文件上传 ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- 联网检索（题库没命中时的兜底）----------
# 用 Bing 的 RSS 结果，不需要任何 API Key。
# 关掉它就完全离线：设 WEB_SEARCH_ENABLED=false
web.search.enabled=${WEB_SEARCH_ENABLED:true}
# 超时（毫秒）：网络慢时宁可没有结果，也不能拖住整个问答
web.search.timeout-ms=5000
# 同一问题在缓存期内不再重复打网络
web.search.cache-minutes=10

# ---------- 静态资源（前端）----------
# 两个位置：
#   1) classpath:/static/  —— 打包进 jar 的前端（生产用）
#   2) file:../frontend/   —— 开发时直接读仓库里的 frontend 目录，
#                             改完刷新浏览器就生效，不用重新打包
# 从 backend 目录启动时 ../frontend 就是仓库顶层的 frontend；
# Docker 里该路径不存在，会自动只用 classpath 那份，不报错。
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.mvc.static-path-pattern=/**

# ---------- 日志 ----------
logging.level.com.aikb=debug
